<main class="page">
  <h1>구독 해지</h1>
  <p class="lede" id="unsub-message">처리 중입니다...</p>

  <script>
  (function () {
    // 이메일 하단 "구독 해지" 링크가 이 페이지로 온다(?token=... 형태). 이 페이지는
    // deploy/에도 별도 정적 파일(unsubscribe.html)로 그대로 복사돼 SPA 해시 라우팅과
    // 무관하게 실제 URL로 바로 열린다 -- 이메일 링크는 실제 페이지 로드가 안전하다.
    // TODO: index.html의 구독 폼과 마찬가지로 실제 Supabase 프로젝트 값으로 채운다.
    var SUPABASE_URL = "";
    var SUPABASE_ANON_KEY = "";

    var msg = document.getElementById("unsub-message");
    var params = new URLSearchParams(location.search);
    var token = params.get("token");

    if (!token) {
      msg.textContent = "구독 해지 링크가 올바르지 않습니다. 이메일 하단의 링크를 다시 확인해주세요.";
      return;
    }
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      msg.textContent = "구독 해지 기능이 아직 준비 중입니다.";
      return;
    }

    fetch(SUPABASE_URL + "/rest/v1/subscribers?unsubscribe_token=eq." + encodeURIComponent(token), {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Prefer": "return=representation",
      },
      body: JSON.stringify({ active: false }),
    })
      .then(function (res) { return res.json().then(function (rows) { return { ok: res.ok, rows: rows }; }); })
      .then(function (result) {
        if (result.ok && result.rows && result.rows.length > 0) {
          msg.textContent = "구독이 해지됐습니다. 그동안 봐주셔서 감사합니다.";
        } else {
          msg.textContent = "이미 해지됐거나 유효하지 않은 링크입니다.";
        }
      })
      .catch(function () {
        msg.textContent = "처리 중 문제가 생겼습니다. 잠시 후 다시 시도해주세요.";
      });
  })();
  </script>
